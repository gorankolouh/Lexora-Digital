<style>
:root{
  --ink:#16181B; --paper:#F4F1EC; --card:#FFFFFF; --line:#E4DED3; --muted:#5A5D63;
  --brass:#B8893E; --brass-lt:#D4A757; --brass-dk:#7A5618; --green:#1F7A4D; --soft:#E9E3D8;
}
*{box-sizing:border-box}
html,body{margin:0}
body{font-family:Inter,system-ui,sans-serif;background:var(--paper);color:var(--ink);line-height:1.5;-webkit-font-smoothing:antialiased}
h1,h2,h3,.display{font-family:Oswald,sans-serif;letter-spacing:.4px;line-height:1.08;margin:0}
a{color:var(--brass-dk)}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
img{display:block;max-width:100%}
.wrap{max-width:1180px;margin:0 auto;padding:0 20px}
.demo-bar{background:var(--brass);color:var(--ink);font-size:13px;font-weight:600}
.demo-bar .wrap{display:flex;gap:12px;align-items:center;justify-content:space-between;flex-wrap:wrap;padding-top:8px;padding-bottom:8px}
.demo-bar button{background:var(--ink);color:var(--paper);border:0;border-radius:8px;padding:6px 12px;font-size:12px;font-weight:600;min-height:32px}
header.top{background:var(--ink);color:var(--paper);position:sticky;top:0;z-index:20}
header.top .wrap{display:flex;align-items:center;justify-content:space-between;gap:16px;height:68px}
.logo{display:flex;flex-direction:column;cursor:pointer;background:none;border:0;color:inherit;text-align:left;padding:0}
.logo b{font-family:Oswald,sans-serif;font-size:21px;letter-spacing:1.6px}
.logo span{font-size:10px;letter-spacing:2.4px;color:var(--brass-lt)}
nav.main{display:flex;gap:4px;align-items:center}
nav.main button{background:none;border:0;color:#D9D4CA;font-weight:600;font-size:14px;padding:10px 12px;border-radius:8px;min-height:44px}
nav.main button.on,nav.main button:hover{color:#fff;background:#25282C}
.icon-btn{position:relative;width:44px;height:44px;border-radius:22px;border:1px solid #3A3D42;background:transparent;color:var(--paper);display:inline-flex;align-items:center;justify-content:center}
.badge{position:absolute;top:-3px;right:-3px;min-width:20px;height:20px;border-radius:10px;background:var(--brass);color:var(--ink);font-size:11px;font-weight:700;display:flex;align-items:center;justify-content:center;padding:0 5px}
.hide-sm{}
@media (max-width:760px){.hide-sm{display:none!important}}
.mobile-nav{display:none}
@media (max-width:760px){

  .mobile-nav button{background:none;border:0;height:62px;font-size:11px;font-weight:600;color:var(--muted);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px}

  body{padding-bottom:62px}
}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:46px;padding:0 20px;border-radius:11px;border:0;font-weight:600;font-size:15px;text-decoration:none;white-space:nowrap}
.btn-brass{background:var(--brass);color:var(--ink)}
.btn-ink{background:var(--ink);color:var(--paper)}
.btn-line{background:transparent;border:1px solid #5A5D63;color:var(--paper)}
.btn-ghost{background:#fff;border:1px solid var(--line);color:var(--ink)}
.btn-green{background:var(--green);color:#fff}
.btn-block{width:100%}
.hero{background:var(--ink);color:var(--paper)}
.hero .wrap{display:grid;grid-template-columns:1.1fr .9fr;gap:40px;align-items:center;padding-top:56px;padding-bottom:64px}
.hero h1{font-size:clamp(38px,6vw,66px)}
.hero p{color:#C9C4BA;font-size:17px;max-width:520px;margin:16px 0 26px}
.hero-art{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.hero-art img{border-radius:18px;aspect-ratio:1;object-fit:cover;width:100%}
.hero-art img:nth-child(2){margin-top:40px}
@media (max-width:860px){.hero .wrap{grid-template-columns:1fr;padding-top:36px;padding-bottom:40px}.hero-art{display:none}}
.trust{display:flex;gap:22px;flex-wrap:wrap;margin-top:28px;font-size:13px;color:#C9C4BA}
.trust span::before{content:"";display:inline-block;width:7px;height:7px;border-radius:4px;background:var(--brass);margin-right:8px;vertical-align:middle}
section.block{padding:40px 0}
.sec-head{display:flex;justify-content:space-between;align-items:flex-end;gap:16px;flex-wrap:wrap;margin-bottom:18px}
.sec-head h2{font-size:30px}
.muted{color:var(--muted)}
.small{font-size:13px}
.seg{display:inline-grid;grid-template-columns:1fr 1fr;gap:4px;padding:4px;background:var(--soft);border-radius:12px}
.seg button{border:0;background:transparent;border-radius:9px;padding:0 20px;height:40px;font-weight:600;font-size:14px}
.seg button.on{background:var(--ink);color:var(--paper)}
.chips{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:18px}
.chip{border:1px solid var(--line);background:#fff;border-radius:20px;padding:0 14px;height:38px;font-size:13px;font-weight:600}
.chip.on{background:var(--ink);color:var(--paper);border-color:var(--ink)}
.notice{display:flex;gap:12px;align-items:flex-start;padding:14px 16px;border-radius:14px;background:#fff;border:1px solid var(--line);margin-bottom:18px}
.notice.dark{background:var(--ink);color:var(--paper);border-color:var(--ink);align-items:center;justify-content:space-between}
.grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:16px}
@media (max-width:1000px){.grid{grid-template-columns:repeat(3,minmax(0,1fr))}}
@media (max-width:700px){.grid{grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;overflow:hidden;display:flex;flex-direction:column}
.card .ph{background:none;border:0;padding:0;display:block;width:100%}
.card .ph img{width:100%;aspect-ratio:1;object-fit:cover;transition:transform .3s}
.card:hover .ph img{transform:scale(1.03)}
.card .body{padding:12px 14px 14px;display:flex;flex-direction:column;gap:6px;flex:1}
.cat{font-size:11px;letter-spacing:1.2px;color:var(--muted);font-weight:600}
.pname{font-size:15px;font-weight:600;line-height:1.3;background:none;border:0;padding:0;text-align:left}
.price{font-size:17px;font-weight:700}
.was{font-size:13px;color:var(--muted);text-decoration:line-through;margin-left:6px;font-weight:500}
.lock{display:inline-flex;align-items:center;gap:6px;font-size:13px;font-weight:600;color:var(--brass-dk)}
.card .btn{margin-top:auto;min-height:44px;font-size:14px}
.split{display:grid;grid-template-columns:1fr 1fr;gap:40px;align-items:start}

.pd-img{border-radius:20px;overflow:hidden;border:1px solid var(--line);background:#fff}

.qty span{min-width:44px;text-align:center;font-weight:700}
.tierbox{background:#fff;border:1px solid var(--line);border-radius:14px;padding:14px;margin:16px 0}
.tierbox table{width:100%;border-collapse:collapse;font-size:14px}
.tierbox td{padding:6px 0;border-bottom:1px solid #EEE9E0}
.tierbox tr:last-child td{border:0}
.panel{background:#fff;border:1px solid var(--line);border-radius:16px;padding:20px}
.field{display:flex;flex-direction:column;gap:6px;font-size:13px;font-weight:600;margin-bottom:12px}
.field input,.field select,.field textarea{height:48px;padding:0 12px;border-radius:10px;border:1px solid #C9C4BA;background:#fff;font-size:15px;font-weight:400}
.field textarea{height:90px;padding:10px 12px}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:12px}

.check{display:flex;gap:10px;align-items:flex-start;font-size:13px;color:var(--muted);margin:6px 0 16px}
.check input{width:20px;height:20px;margin:0;flex-shrink:0}
.radio-card{display:flex;gap:12px;align-items:center;border:1px solid var(--line);border-radius:12px;padding:14px;margin-bottom:10px;cursor:pointer;background:#fff}
.radio-card.on{border-color:var(--ink);box-shadow:0 0 0 1px var(--ink)}
.radio-card input{width:20px;height:20px;margin:0}
.line-item{display:grid;grid-template-columns:72px 1fr auto;gap:14px;align-items:center;padding:14px 0;border-bottom:1px solid #EEE9E0}
.line-item img{width:72px;height:72px;border-radius:12px;object-fit:cover;border:1px solid var(--line)}
.sum-row{display:flex;justify-content:space-between;padding:6px 0;font-size:15px}
.sum-row.total{font-size:19px;font-weight:700;border-top:1px solid var(--line);margin-top:8px;padding-top:12px}
.empty{text-align:center;padding:60px 20px}
.success{text-align:center;max-width:520px;margin:0 auto;padding:56px 20px}
.tick{width:76px;height:76px;border-radius:38px;background:var(--ink);color:var(--brass-lt);display:flex;align-items:center;justify-content:center;margin:0 auto 18px}
.perks{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px;margin:20px 0}
@media (max-width:600px){.perks{grid-template-columns:1fr}}
.perk{background:#fff;border:1px solid var(--line);border-radius:14px;padding:14px}
.perk b{display:block;font-size:15px}
.tabs{display:flex;gap:6px;border-bottom:1px solid var(--line);margin-bottom:20px}
.tabs button{border:0;background:none;padding:12px 6px;margin-right:12px;font-weight:600;color:var(--muted);border-bottom:2px solid transparent;min-height:44px}
.tabs button.on{color:var(--ink);border-color:var(--ink)}
.stats{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px}
@media (max-width:800px){.stats{grid-template-columns:repeat(2,minmax(0,1fr))}}
.stat{background:#fff;border:1px solid var(--line);border-radius:14px;padding:14px}
.stat .v{font-size:26px;font-weight:700;margin-top:4px}
.stat.dark{background:var(--ink);color:var(--paper);border-color:var(--ink)}
.stat.dark .v{color:var(--brass-lt)}

.list .it:last-child{border:0}
.tag{display:inline-block;padding:3px 9px;border-radius:8px;font-size:11px;font-weight:700}
.tag.pending{background:#F3E6CC;color:#6A4A12}
.tag.ok{background:#DCEBDF;color:#1D5A36}
.tag.no{background:#EDE7E4;color:var(--muted)}
.tag.new{background:#DDE6F2;color:#1F3F66}
.switch{width:54px;height:32px;border-radius:16px;border:0;padding:4px;display:flex;background:#C9C4BA;flex-shrink:0}
.switch i{width:24px;height:24px;border-radius:12px;background:#fff;display:block;transition:transform .2s}
.switch.on{background:var(--ink)}
.switch.on i{transform:translateX(22px);background:var(--brass-lt)}
.admin-grid{display:grid;grid-template-columns:1fr 1fr;gap:20px;margin-top:20px}
@media (max-width:860px){.admin-grid{grid-template-columns:1fr}}
.wa-band{background:#fff;border:1px solid var(--line);border-radius:18px;padding:26px;display:grid;grid-template-columns:1.3fr 1fr;gap:20px;align-items:center}
@media (max-width:760px){.wa-band{grid-template-columns:1fr}}
.social{display:flex;gap:8px;flex-wrap:wrap}
.social a{display:inline-flex;align-items:center;height:40px;padding:0 14px;border-radius:20px;border:1px solid var(--line);color:var(--ink);font-size:13px;font-weight:600;text-decoration:none;background:var(--paper)}
footer.foot{background:var(--ink);color:#C9C4BA;margin-top:40px;font-size:13px}

@media (max-width:700px){footer.foot .wrap{grid-template-columns:1fr}}
footer.foot h4{color:#fff;font-size:14px;margin:0 0 10px}
footer.foot button{display:block;background:none;border:0;color:#C9C4BA;padding:4px 0;font-size:13px}
.toast{position:fixed;left:50%;bottom:84px;transform:translateX(-50%) translateY(20px);background:var(--ink);color:var(--paper);padding:12px 18px;border-radius:12px;font-size:14px;font-weight:600;opacity:0;pointer-events:none;transition:.25s;z-index:50;box-shadow:0 8px 24px rgba(0,0,0,.2)}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
.crumb{background:none;border:0;padding:0;color:var(--brass-dk);font-weight:600;font-size:14px;margin:24px 0 16px;display:inline-flex;align-items:center;gap:6px;min-height:44px}
.price-input{width:90px;height:38px;border:1px solid #C9C4BA;border-radius:8px;padding:0 8px}
.view{animation:fade .25s ease}
@keyframes fade{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
</style>

  if(tab==='products') body=`<p class="muted small" style="margin-top:0">Change a price and it updates in the shop straight away.</p><div class="list">${PRODUCTS.map(p=>`<div class="it"><div style="display:flex;gap:12px;align-items:center"><img src="${p.img}" alt="" style="width:52px;height:52px;border-radius:10px;border:1px solid var(--line)"><div><b>${p.name}</b><div class="small muted">${p.cat} · min. trade ${p.moq}</div></div></div><div style="display:flex;gap:10px;align-items:center;flex-wrap:wrap"><label class="small muted">Retail $ <input class="price-input" data-pr="${p.id}" data-k="r" value="${p.r.toFixed(2)}" inputmode="decimal"></label><label class="small muted">Trade $ <input class="price-input" data-pr="${p.id}" data-k="w" value="${p.w.toFixed(2)}" inputmode="decimal"></label></div></div>`).join('')}</div><button class="btn btn-ink" style="margin-top:14px" data-act="noop">+ Add product (photo from your phone)</button>`;
  if(tab==='customers') body=`<div class="list">
    <div class="it"><div><b>Fade Studio Ltd</b><div class="small muted">Trade · 14 orders</div></div><span class="tag ok">Trade</span></div>
    <div class="it"><div><b>Kings Cuts Barbers</b><div class="small muted">Trade applicant</div></div>${tagFor(S.apps.a1)}</div>
    <div class="it"><div><b>Mark D.</b><div class="small muted">Retail · 3 orders · via Instagram</div></div><span class="tag no">Retail</span></div>
    <div class="it"><div><b>Sarah K.</b><div class="small muted">Retail · 1 order</div></div><span class="tag no">Retail</span></div></div>`;
  return `<div style="background:var(--ink);color:var(--paper)"><div class="wrap" style="padding-top:26px;padding-bottom:26px">
      <div class="small" style="color:#C9C4BA">Owner app · works on your phone</div>
      <h1 style="font-size:34px">GOOD MORNING</h1>
    </div></div>
    <div class="wrap" style="padding-top:20px;padding-bottom:30px">${tabs}${body}</div>`;
}

function render(){
  const v=S.view;
  const views={shop:viewShop,product:viewProduct,cart:viewCart,done:viewDone,wholesale:viewWholesale,account:viewAccount,owner:viewOwner};
  app.innerHTML=`<div class="view">${(views[v]||viewShop)()}</div>`;
  $('#cartBadge').textContent=cartCount();
  $('#navAccount').textContent=trade()?'My trade account':'Log in';
  document.querySelectorAll('[data-nav]').forEach(b=>b.classList.toggle('on',b.dataset.nav===(v==='product'?'shop':v)));
}
function go(v){
  S.view=v; render(); window.scrollTo({top:0,behavior:'instant'});
  const h = v==='product'||v==='done' ? '' : v;
  try{ if(h && location.hash!=='#'+h) history.replaceState(null,'','#'+h); }catch(e){}
}

document.addEventListener('click',e=>{
  const t=e.target.closest('[data-go],[data-act],[data-prod],[data-add],[data-addq],[data-cat],[data-cm],[data-cp],[data-appr],[data-dec],[data-ch],[data-otab],[data-scroll]');
  if(!t) return;
  const d=t.dataset;
  if(d.scroll){e.preventDefault();document.getElementById(d.scroll).scrollIntoView({behavior:'smooth'});return;}
  if(t.tagName==='A') e.preventDefault();
  if(d.go){ if(d.go==='wholesale') S.applied=S.applied&&true; go(d.go); return;}
  if(d.prod){S.product=d.prod;S.qty=trade()?P(d.prod).moq:1;go('product');return;}
  if(d.add){addToCart(d.add,trade()?P(d.add).moq:1);return;}
  if(d.addq){addToCart(d.addq,S.qty);return;}
  if(d.cat){S.cat=d.cat;render();return;}
  if(d.cm){const p=P(d.cm);const step=1;S.cart[d.cm]-=step; if(trade()&&S.cart[d.cm]<p.moq) S.cart[d.cm]=0; if(S.cart[d.cm]<=0) delete S.cart[d.cm]; render();return;}
  if(d.cp){S.cart[d.cp]++;render();return;}
  if(d.appr){S.apps[d.appr]='approved';toast('Approved — customer notified by email & WhatsApp');render();return;}
  if(d.dec){S.apps[d.dec]='declined';render();return;}
  if(d.ch){S.ch[d.ch]=!S.ch[d.ch];render();return;}
  if(d.otab){S.ownerTab=d.otab;render();return;}
  switch(d.act){
    case 'retail': S.mode='retail'; if(S.approved){S.approved=false;toast('Logged out of trade account');} render(); break;
    case 'wholesaleMode': S.mode='wholesale'; render(); break;
    case 'demoLogin': S.approved=true; S.mode='wholesale'; toast('Logged in as Fade Studio Ltd'); render(); break;
    case 'logout': S.approved=false; S.mode='retail'; S.pay='card'; toast('Logged out'); go('shop'); break;
    case 'qminus': {const min=trade()?P(S.product).moq:1; S.qty=Math.max(min,S.qty-1); render(); break;}
    case 'qplus': S.qty++; render(); break;
    case 'reorder': ['crew','uppercut','spray'].forEach(id=>{S.cart[id]=(S.cart[id]||0)+P(id).moq}); toast('Usual order added to cart'); go('cart'); break;
    case 'wa': toast('Opens WhatsApp chat with the shop'); break;
    case 'noop': toast('Demo — this would open in the live shop'); break;
  }
});
document.addEventListener('change',e=>{
  if(e.target.name==='pay'){S.pay=e.target.value;render();}
  if(e.target.dataset.pr){const p=P(e.target.dataset.pr);const v=parseFloat(String(e.target.value).replace(',','.'));if(!isNaN(v)&&v>0){p[e.target.dataset.k]=v;toast('Price updated in the shop');}}
});
document.addEventListener('submit',e=>{
  e.preventDefault();
  const id=e.target.id;
  if(id==='checkout'){
    const ids=Object.keys(S.cart);
    const total=ids.reduce((a,i)=>a+unit(P(i))*S.cart[i],0);
    const sub=total; const ship=sub>=99?0:9.95;
    const no=1049+S.orders.filter(o=>o.fresh).length;
    S.orders.unshift({no,who:trade()?'Fade Studio Ltd':'New customer',type:trade()?'Wholesale':'Retail',ch:'Website',items:cartCount(),total:sub+ship,st:S.pay==='invoice'?'Invoice sent':S.pay==='wa'?'Awaiting WhatsApp':'Paid',fresh:true});
    S.order={no,pay:S.pay}; S.cart={}; S.ownerTab='orders'; go('done');
  }
  if(id==='applyForm'){S.applied=true;S.ownerTab='home';go('wholesale');}
  if(id==='loginForm'){S.approved=true;S.mode='wholesale';toast('Welcome back, Fade Studio Ltd');go('shop');}
});
function fromHash(){const h=(location.hash||'').slice(1);if(['shop','wholesale','cart','account','owner'].includes(h)){S.view=h;}render();}
window.addEventListener('hashchange',fromHash);
fromHash();
})();
</script>
</body>
</html>
