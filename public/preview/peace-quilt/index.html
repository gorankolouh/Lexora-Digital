const ME={name:'Demo account',ini:'DA',role:'Mediator',bio:'Collecting peace stories from the Riverside district.'};
let links=[];
function buildLinks(){
  links=[];
  THEMES.forEach((_,k)=>{const m=S.stories.filter(s=>s.theme===k);
    m.forEach((s,j)=>{links.push({a:s.id,b:m[(j+1)%m.length].id,type:'theme'});if(m.length>4&&j%2===0)links.push({a:s.id,b:m[(j+2)%m.length].id,type:'theme'});});});
  PLACES.forEach((_,p)=>{const m=S.stories.filter(s=>s.place===p).sort((x,y)=>x.theme-y.theme);
    for(let j=0;j+1<m.length;j++)if(m[j].theme!==m[j+1].theme)links.push({a:m[j].id,b:m[j+1].id,type:'place'});});
  S.inspired.forEach(([a,b])=>links.push({a,b,type:'inspired'}));
}
function connected(id){
  const seen={},out=[];
  links.forEach(l=>{if(l.a!==id&&l.b!==id)return;const o=l.a===id?l.b:l.a;if(seen[o])return;seen[o]=1;out.push({s:S.stories[o],type:l.type});});
  return out;
}

  layoutC();
  cv.onclick=ev=>{const r=cv.getBoundingClientRect(),mx=ev.clientX-r.left,my=ev.clientY-r.top,e=ease(t);let best=-1,bd=1e9;
    S.stories.forEach(s=>{const[x,y]=pos(s,e),sz=lerp(s.qs,10,e),d=Math.hypot(mx-x,my-y);if(d<sz/2+12&&d<bd){bd=d;best=s.id;}});
    if(best>=0){cSel=best;document.getElementById('peek').innerHTML=peekHtml();kick();}};
  document.getElementById('peek').innerHTML=peekHtml();
  if(flashId>=0){flashT=1;}
  draw();
  if(!reduce&&cMode===0)setTimeout(()=>{if(cur==='constellation'&&target===0){cMode=1;target=1;document.querySelectorAll('[data-mode]').forEach(b=>b.classList.toggle('on',b.dataset.mode==='1'));kick();}},1500);
  kick();
}
function layoutC(){
  const r=cv.getBoundingClientRect(),dpr=window.devicePixelRatio||1;W=r.width;H=r.height;cv.width=W*dpr;cv.height=H*dpr;ctx.setTransform(dpr,0,0,dpr,0,0);
  const n=S.stories.length,cols=W<560?6:10,rows=Math.ceil(n/cols),cell=Math.min((W-32)/cols,(H-60)/rows),ox=(W-cell*cols)/2,oy=(H-30-cell*rows)/2;
  S.stories.forEach((s,i)=>{s.qx=ox+(i%cols+.5)*cell;s.qy=oy+(Math.floor(i/cols)+.5)*cell;s.qs=cell-6;});
  const cx=W/2,cy=H/2-14,rx=W*(W<560?.29:.33),ry=H*.29,cr=Math.min(W,H)*(W<560?.1:.085);
  labelPos=[];
  THEMES.forEach((_,k)=>{const a=-Math.PI/2+k*2*Math.PI/THEMES.length,tx=cx+Math.cos(a)*rx,ty=cy+Math.sin(a)*ry;
    const m=S.stories.filter(s=>s.theme===k);m.forEach((s,j)=>{const b=j*2*Math.PI/m.length+k,rr=cr*(1+.12*Math.sin(j*2.7));s.cx=tx+Math.cos(b)*rr;s.cy=ty+Math.sin(b)*rr;});
    labelPos[k]=[tx,ty+cr+18];});
  if(!stars.length)for(let i=0;i<150;i++)stars.push([Math.random(),Math.random(),Math.random()*1.1+.2,Math.random()]);
}
const ease=x=>x<.5?2*x*x:1-Math.pow(-2*x+2,2)/2,lerp=(a,b,e)=>a+(b-a)*e;
function pos(s,e){return[lerp(s.qx,s.cx,e),lerp(s.qy,s.cy,e)];}
function draw(){
  if(!ctx)return;const e=ease(t);
  ctx.fillStyle='#050605';ctx.fillRect(0,0,W,H);
  if(e>0)stars.forEach(s=>{ctx.fillStyle=`rgba(238,242,234,${e*(.15+.4*s[3])})`;ctx.beginPath();ctx.arc(s[0]*W,s[1]*H,s[2],0,7);ctx.fill();});
  const la=Math.max(0,(e-.45)/.55);
  if(la>0){links.forEach(l=>{const A=S.stories[l.a],B=S.stories[l.b];if(!A||!B)return;
      const dim=cRole&&A.role!==cRole&&B.role!==cRole,hot=l.a===cSel||l.b===cSel;
      const rgb=l.type==='theme'?'198,244,50':l.type==='place'?'110,231,183':'249,168,212';
      ctx.strokeStyle=`rgba(${rgb},${(hot?.95:l.type==='theme'?.4:.2)*la*(dim?.2:1)})`;ctx.lineWidth=hot?1.8:1;ctx.setLineDash(l.type==='theme'?[]:[3,4]);
      const[ax,ay]=pos(A,e),[bx,by]=pos(B,e);ctx.beginPath();ctx.moveTo(ax,ay);
      if(l.type==='theme')ctx.lineTo(bx,by);else ctx.quadraticCurveTo((ax+bx)/2+(ay-by)*.15,(ay+by)/2+(bx-ax)*.15,bx,by);ctx.stroke();});
    ctx.setLineDash([]);ctx.font='600 12px "DM Sans", sans-serif';ctx.textAlign='center';
    SHORT.forEach((nm,k)=>{const[x,y]=labelPos[k];ctx.fillStyle=`rgba(198,244,50,${la*.9})`;ctx.fillText(nm.toUpperCase(),x,Math.min(y,H-36));});}
  S.stories.forEach(s=>{const[x,y]=pos(s,e),col=ROLES[s.role],dim=cRole&&s.role!==cRole,sz=lerp(s.qs,s.id===cSel?14:10,e),rad=lerp(4,sz/2,e);
    ctx.globalAlpha=dim?.15:1;ctx.shadowColor=col;ctx.shadowBlur=e*16;ctx.fillStyle=col;
    ctx.beginPath();ctx.roundRect(x-sz/2,y-sz/2,sz,sz,rad);ctx.fill();ctx.shadowBlur=0;
    if(e<.6&&s.qs>22){ctx.strokeStyle=`rgba(5,6,5,${.5*(1-e/.6)})`;ctx.setLineDash([3,3]);ctx.lineWidth=1;ctx.beginPath();ctx.roundRect(x-sz/2+4,y-sz/2+4,sz-8,sz-8,2);ctx.stroke();ctx.setLineDash([]);
      ctx.fillStyle=`rgba(5,6,5,${.65*(1-e/.6)})`;ctx.font=`700 ${Math.max(9,sz*.18)}px "DM Sans", sans-serif`;ctx.textAlign='center';ctx.fillText(s.media.toUpperCase(),x,y+sz*.06);}
    if(s.id===cSel){ctx.strokeStyle='#EEF2EA';ctx.lineWidth=2;ctx.beginPath();ctx.roundRect(x-sz/2-4,y-sz/2-4,sz+8,sz+8,rad+4);ctx.stroke();}
    if(s.id===flashId&&flashT>0){ctx.strokeStyle=`rgba(198,244,50,${flashT})`;ctx.lineWidth=2;ctx.beginPath();ctx.arc(x,y,sz/2+6+(1-flashT)*28,0,7);ctx.stroke();}
    ctx.globalAlpha=1;});
}
function kick(){if(running)return;running=true;requestAnimationFrame(tick);}
function tick(){
  if(cur!=='constellation'||!document.getElementById('cv')){running=false;return;}
  let mv=false;
  if(t!==target){const d=reduce?1:.02;t=target>t?Math.min(target,t+d):Math.max(target,t-d);mv=true;}
  if(flashT>0){flashT=Math.max(0,flashT-.008);mv=true;if(flashT===0)flashId=-1;}
  draw();if(mv)requestAnimationFrame(tick);else running=false;
}
window.addEventListener('resize',()=>{if(cur==='constellation'&&cv){layoutC();draw();}if(cur==='welcome')sizeHero();});

/* ---------- hero animation ---------- */
let hc,hx,hp=[],hRaf=0,hW=0,hH=0;
function sizeHero(){if(!hc)return;const r=hc.getBoundingClientRect(),d=window.devicePixelRatio||1;hW=r.width;hH=r.height;hc.width=hW*d;hc.height=hH*d;hx.setTransform(d,0,0,d,0,0);}
function startHero(){
  hc=document.getElementById('hc');if(!hc)return;hx=hc.getContext('2d');sizeHero();
  const cols=Object.values(ROLES);
  hp=Array.from({length:Math.round(Math.min(90,hW*hH/14000))},(_,i)=>({x:Math.random()*hW,y:Math.random()*hH,vx:(Math.random()-.5)*.25,vy:(Math.random()-.5)*.25,c:i%4===0?cols[i%cols.length]:'#C6F432',r:Math.random()*1.6+1}));
  const frame=()=>{hx.fillStyle='#0A0B0A';hx.fillRect(0,0,hW,hH);
    for(let i=0;i<hp.length;i++){const a=hp[i];if(!reduce){a.x+=a.vx;a.y+=a.vy;if(a.x<0||a.x>hW)a.vx*=-1;if(a.y<0||a.y>hH)a.vy*=-1;}
      for(let j=i+1;j<hp.length;j++){const b=hp[j],d=Math.hypot(a.x-b.x,a.y-b.y);if(d<130){hx.strokeStyle=`rgba(198,244,50,${(1-d/130)*.22})`;hx.lineWidth=1;hx.beginPath();hx.moveTo(a.x,a.y);hx.lineTo(b.x,b.y);hx.stroke();}}}
    hp.forEach(a=>{hx.shadowColor=a.c;hx.shadowBlur=10;hx.fillStyle=a.c;hx.globalAlpha=.85;hx.beginPath();hx.arc(a.x,a.y,a.r,0,7);hx.fill();});hx.shadowBlur=0;hx.globalAlpha=1;
    const g=hx.createLinearGradient(0,0,hW*.7,0);g.addColorStop(0,'rgba(10,11,10,.92)');g.addColorStop(1,'rgba(10,11,10,0)');hx.fillStyle=g;hx.fillRect(0,0,hW,hH);
    if(!reduce)hRaf=requestAnimationFrame(frame);};
  frame();
}
function stopHero(){cancelAnimationFrame(hRaf);hc=null;}

buildLinks();route();
</script>
